name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install npm with trusted publishing and staged publishing
        run: npm install -g npm@latest
      - run: npm ci
      - name: Tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run llms-full
      - run: git diff --exit-code llms-full.txt
      - run: npm run check
      - name: Stage the release (approve it on npmjs.com)
        run: npm stage publish --provenance --access public
      - name: GitHub release
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
